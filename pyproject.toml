[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-visual-doctor"
version = "0.1.0"
description = "Scan published Power BI reports for broken visuals and triage them with Jev or Laya typed decision models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishabh Bhardwaj" }]
keywords = ["power-bi", "playwright", "jev", "laya", "data-quality", "bi-testing"]
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
laya = ["laya>=0.3.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pbi-doctor = "pbi_visual_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbi_visual_doctor = ["defaults.yaml", "templates/*.html", "demo/*.html", "demo/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
