# Copy to targets.yaml and fill in your own workspace and report ids.
# Find them in the report URL:
#   https://app.powerbi.com/groups/<workspace-id>/reports/<report-id>/<page-section>

reports:
  # Pages listed: each page is opened directly and pages are scanned in parallel.
  - name: Sales Overview
    url: https://app.powerbi.com/groups/00000000-0000-0000-0000-000000000000/reports/11111111-1111-1111-1111-111111111111
    pages:
      - ReportSection1a2b3c4d5e6f            # page section id, appended to the report URL
      - name: Bookings                        # or an explicit name and URL
        url: https://app.powerbi.com/groups/00000000-0000-0000-0000-000000000000/reports/11111111-1111-1111-1111-111111111111/ReportSection7a8b9c

  # No pages listed: if PBI_ACCESS_TOKEN is set, pages come from the REST API;
  # otherwise the crawler clicks through the report's page tabs.
  - name: Guest Experience
    url: https://app.powerbi.com/groups/00000000-0000-0000-0000-000000000000/reports/22222222-2222-2222-2222-222222222222

# Optional: every report in these workspaces (requires PBI_ACCESS_TOKEN).
# workspaces:
#   - id: 00000000-0000-0000-0000-000000000000
#     exclude: ["Archive - old sales report"]
